spring.application.name=bank-app

# --- datasource: reads env vars, falls back to local-dev defaults (.env.example) ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:bankapp}
spring.datasource.username=${POSTGRES_USER:bankapp}
spring.datasource.password=${POSTGRES_PASSWORD:local-dev-only-change-me}

# --- JPA: Flyway owns the schema; Hibernate only VERIFIES the mapping matches ---
spring.jpa.hibernate.ddl-auto=validate

# --- disable the anti-pattern where a DB session stays open during view rendering ---
spring.jpa.open-in-view=false

# --- format framework-level errors (bad JSON, 404, 405, ...) as RFC 7807 ProblemDetail too ---
spring.mvc.problemdetails.enabled=true

# --- NOT a perf toggle: this is the deadlock guard for transfers (ADR-003 §3).
# Hibernate batches UPDATEs at flush; without this it emits them in whatever order
# entities entered the persistence context. Concurrent A->B and B->A transfers would
# then lock the two `accounts` rows in opposite orders and deadlock. Sorting by
# primary key gives every transaction the same lock order.
# Removing this line silently reintroduces a deadlock that only appears under load.
# See AccountLedgerAdapter and TransferDeadlockTest. ---
spring.jpa.properties.hibernate.order_updates=true
